name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore/reelguard-release.jks
          {
            echo "storeFile=keystore/reelguard-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Package and checksum
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "ReelGuard-${VERSION}.apk"
          sha256sum "ReelGuard-${VERSION}.apk" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="${RUNNER_TEMP}/release-notes.md"
          sed "s/{{VERSION}}/${VERSION}/g" .github/release-notes.md > "$NOTES"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ReelGuard-*.apk SHA256SUMS.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" ReelGuard-*.apk SHA256SUMS.txt \
              --title "ReelGuard ${VERSION}" \
              --notes "$(cat "$NOTES")" \
              --generate-notes
          fi

      - name: Clean up signing key
        if: always()
        run: rm -f keystore.properties keystore/reelguard-release.jks
